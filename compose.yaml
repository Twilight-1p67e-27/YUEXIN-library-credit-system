services:
  library:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DB_PATH: /data/library.db
      CREDIT_THRESHOLD: "60"
      CORS_ORIGINS: "http://localhost,https://localhost,capacitor://localhost"
    volumes:
      - library-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  library-data:
